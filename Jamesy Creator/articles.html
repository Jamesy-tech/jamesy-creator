Using any computer that has a Linux terminal, you can run commands that make you look like a pro. All of these commands are harmless and won't do anything to your computer.<br>
Every command will be explained so you understand what they do. (Tip: Go fullscreen while using these commands)<br>

<h2>Command 1: btop</h2>
Install by using: <div style="font-family:monospace;">sudo apt install btop<br><br></div>

The 'btop' command is basically just a system monitor for your terminal. It shows your CPU, RAM, processes and other stuff happening on your computer.<br>

<h2>Command 2: speedometer</h2>
Install by using: <div style="font-family:monospace;">sudo apt install speedometer<br><br></div>

The 'speedometer' lets you see your network traffic in the terminal. You can view things like your download and upload speed in real time. It might not look like you're hacking, but it definitely looks like you're doing something important!<br>

<h2>Command 3: cmatrix</h2>
Install by using: <div style="font-family:monospace;">sudo apt install cmatrix<br><br></div>

The 'cmatrix' command starts a fun matrix animation in your terminal. It doesn't really do anything useful, but it looks awesome.<br><br>

And that's it! 3 completely harmless commands that can make your Linux terminal look way more complicated than it actually is. Now you can open your terminal, type a few commands, and look like you know exactly what you're doing.

window.onload = () => {

    const query = getQueryParam("query") || "";
    renderArticles(query);

    const articleId = getQueryParam("article");
    if (articleId) {
        openArticle(articleId);
    }
};

    const articlesGrid = document.getElementById('articlesGrid');
    const noResults = document.getElementById('noResults');

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function renderArticles(filterText = "") {
        articlesGrid.innerHTML = "";
        const cleanQuery = filterText.toLowerCase().trim();

        const filtered = articlesData.filter(article => {
            return article.title.toLowerCase().includes(cleanQuery) ||
                   article.author.toLowerCase().includes(cleanQuery) ||
                   article.description.toLowerCase().includes(cleanQuery);
        });

        if (filtered.length === 0) {
            noResults.style.display = 'block';
            return;
        }

        noResults.style.display = 'none';

        filtered.forEach(article => {
            const card = document.createElement('div');
            card.className = `card ${article.color}`;
            card.onclick = () => openArticle(article.id);

            card.innerHTML = `
                <div class="card-title-group">
                    <div>${article.title}</div>
                    <div class="card-author">By ${article.author} — ${article.description}</div>
                </div>
                <span class="material-symbols-outlined">chevron_right</span>
            `;
            articlesGrid.appendChild(card);
        });
    }

    function openArticle(id) {
        const article = articlesData.find(a => a.id === id);
        if (!article) return;

        document.getElementById('readTitle').textContent = article.title;
        document.getElementById('readAuthor').textContent = `By ${article.author}`;
        document.getElementById('readDescription').textContent = article.description;
        document.getElementById('readContent').innerHTML = article.content;

        document.getElementById('listView').classList.remove('active');
        document.getElementById('readView').classList.add('active');
        window.scrollTo(0,0);

        currentArticleId = id;

const url = new URL(window.location);
url.searchParams.set("article", id);
window.history.replaceState({}, "", url);

    }

    function showListView() {
        document.getElementById('readView').classList.remove('active');
        document.getElementById('listView').classList.add('active');

        const url = new URL(window.location);
url.searchParams.delete("article");
window.history.replaceState({}, "", url);

    }

   window.onload = () => {
    const query = getQueryParam("query") || "";
    renderArticles(query);

    const articleId = getQueryParam("article");
    if (articleId) {
        openArticle(articleId);
    }
};

    function shareArticle() {
    if (!currentArticleId) return;

    const link = window.location.href;

    prompt("Share", link);
}

function updateBackButton() {
    const topPath = window.top.location.pathname;

    if (topPath.endsWith("/articles.html") || topPath.endsWith("articles.html")) {
        document.getElementById("backArticlesBtn").style.display = "none";
        document.getElementById("backHomeBtn").style.display = "inline-flex";
    } else {
        document.getElementById("backArticlesBtn").style.display = "inline-flex";
        document.getElementById("backHomeBtn").style.display = "none";
    }
}

updateBackButton()
