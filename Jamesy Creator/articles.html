<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles | Jamesy Creator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<link rel="icon" href="shapes.png">

<style>
:root {
    --primary-blue: #1456d3;
    --border-color: #e5e7eb;
}

* {
    box-sizing: border-box;
    font-family: "Nunito", sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background: #ffffff;
    color: #1b1b1b;
    padding: 48px 30px;
    padding-right:34px;
    padding-left:30px;
    height: 100vh;
    overflow-y: auto;
}

.view {
    display: none;
    width: 100%;
}

.view.active {
    display: block;
}

.page-header {
    margin-bottom: 32px;
}

.page-header h1 {
    font-size: 32px;
    font-weight:700;
    margin-bottom: 8px;
}

.page-header p {
    color: #6b7280;
    font-weight: 600;
}

.cards-grid {
    display: grid;
    grid-template-columns: 1fr; 
    gap: 16px;
    padding-bottom: 40px;
    width: 100%;
}

.card {
    padding: 24px 32px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    text-align: left;
    width: 100%;
}

.card:hover { 
    outline: 3px solid white;
    outline-offset: -6px;
    box-shadow: 0 0 0 3px currentColor;
    filter: brightness(1.05);
}

.card.green { background: #daf5dc; color: #1a5e2e; }
.card.yellow { background: #fff3c7; color: #8a5800; }
.card.orange { background: #ffe6cc; color: #d35400; }
.card.pink { background: #fce4ec; color: #c2185b; }
.card.teal { background: #d2f2f0; color: #00796b; }
.card.blue { background: #c9e1fc; color: #215a99; }
.card.purple { background: #f3e5f5; color: #6a1b9a; }
.card.red {
  background: #f8d7da;
  color: #b92929;
}

.card-title-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.card-author {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.85;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    background: #e8f0fe;
    color: var(--primary-blue);
    font-weight: 700;
    border: none;
    cursor: pointer;
    margin-bottom: 24px;
    transition: all 0.2s ease;
}

.back-btn:hover {
    outline: 3px solid white;
    outline-offset: -3px;
    box-shadow: 0 0 0 1.5px #1865f2;
}

.share-btn {
    background: #daf5dc;
    color: #1a5e2e;
}

.share-btn:hover {
    outline: 3px solid white;
    outline-offset: -3px;
    box-shadow: 0 0 0 1.5px #1a5e2e;
}

.article-meta {
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 16px;
    margin-bottom: 24px;
}

.article-meta h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
}

.article-sub {
    display: flex;
    gap: 16px;
    font-size: 14px;
    color: #6b7280;
    font-weight: 600;
}

.home-btn {
    background: #f8d7da;
    color: #b92929;
}

.home-btn:hover {
    outline: 3px solid white;
    outline-offset: -3px;
    box-shadow: 0 0 0 1.5px #b92929;
}

.article-body {
    font-size: 16px;
    line-height: 1.6;
    color: #374151;
}

.article-body p {
    margin-bottom: 16px;
}

.article-body h2 {
    font-size: 22px;
    margin: 24px 0 12px 0;
    color: #111827;
}

#noResults {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
}
</style>
</head>
<body>

    <div id="listView" class="view active">
        <div class="page-header">
            <h1 style="margin-left:3px;">Articles</h1>
            <p style="margin-left:3px;">Explore guides, tutorials, & updates</p>
        </div>

        <div id="noResults">
            <span class="material-symbols-outlined" style="font-size: 48px;">search_off</span>
            <h3 style="margin-top: 8px;">No articles found</h3>
        </div>

        <div class="cards-grid" id="articlesGrid"></div>
    </div>

    <div id="readView" class="view">
      
      

        <div style="display:flex; gap:12px; margin-bottom:24px;">
    <button id="backArticlesBtn" class="back-btn" onclick="showListView()">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to Articles
    </button>

    <button id="backHomeBtn" class="back-btn home-btn" onclick="window.top.location.href='index.html'" style="display:none;">
        <span class="material-symbols-outlined">home</span>
        Back to Jamesy Creator
    </button>

    <button class="back-btn share-btn" onclick="shareArticle()">
        <span class="material-symbols-outlined">share</span>
        Share
    </button>
</div>


        <div class="article-meta">
            <h1 id="readTitle">Article Title</h1>
            <div class="article-sub">
                <span id="readAuthor">By Author</span>
                <span>•</span>
                <span id="readDescription">Short Description</span>
            </div>
        </div>

        <div class="article-body" id="readContent"></div>
    </div>

<script>

    let currentArticleId = null;
    
const articlesData = [

content: `
BookUI+ is a bookmarklet that opens a command panel inside your browser. You can run JS code in it with or without knowing JavaScript. It's made to be simple to use and quick to set up.

<p>If you'd like to view the project, source code, or report an issue, visit the GitHub repository: <a href="https://github.com/Jamesy-tech/BookUI" target="_blank">https://github.com/Jamesy-tech/BookUI</a></p>

<h2>Features</h2>

<ul>
  <li>Opens a command-style panel on almost any webpage.</li>
  <li>Lets you run JavaScript instantly.</li>
  <li>Works for both beginners and experienced coders.</li>
  <li>No extensions or installs required.</li>
</ul>

<p><strong>Please note:</strong> BookUI does not work on every website due to browser security restrictions. It should work on sites like Google Search, Wikipedia, Jamesy-tech, and many news websites. It will not work on websites such as Google Docs, Google Classroom, YouTube, Discord, Reddit, Instagram, or Facebook.</p>

<h2>How to get it</h2>

<p><strong>Option 1 (Recommended)</strong></p>

<ol>
  <li>Open <a href="https://github.com/Jamesy-tech/BookUI/blob/main/bookmarklet-code.js" target="_blank">bookmarklet-code.js</a>.</li>
  <li>Copy all of the JavaScript.</li>
  <li>Right-click your bookmarks bar (press <strong>Ctrl + Shift + B</strong> if it's hidden) and choose <strong>Add Page</strong>.</li>
  <li>Name it <strong>BookUI</strong>.</li>
  <li>Paste the JavaScript into the URL field and save.</li>
</ol>

<p><strong>Option 2</strong></p>

<ol>
  <li>Download <a href="https://github.com/Jamesy-tech/BookUI/blob/main/bookmarklet.html" target="_blank">bookmarklet.html</a>.</li>
  <li>Open <code>chrome://bookmarks</code> in Chrome.</li>
  <li>Click the three dots in the top-right corner and select <strong>Import Bookmarks</strong>.</li>
  <li>Select the downloaded file.</li>
  <li>Click the BookUI bookmark on almost any website to open the command panel.</li>
</ol>

<h2>What does it do?</h2>

<p>When you click the bookmark, BookUI+ injects a small command panel onto the current webpage. You can run JavaScript, test ideas, or experiment with how websites work directly in your browser.</p>

<h2>Example uses</h2>

<ul>
  <li>Try small JavaScript commands.</li>
  <li>Test code on a webpage.</li>

`

window.onload = () => {

    const query = getQueryParam("query") || "";
    renderArticles(query);

    const articleId = getQueryParam("article");
    if (articleId) {
        openArticle(articleId);
    }
};

    const articlesGrid = document.getElementById('articlesGrid');
    const noResults = document.getElementById('noResults');

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function renderArticles(filterText = "") {
        articlesGrid.innerHTML = "";
        const cleanQuery = filterText.toLowerCase().trim();

        const filtered = articlesData.filter(article => {
            return article.title.toLowerCase().includes(cleanQuery) ||
                   article.author.toLowerCase().includes(cleanQuery) ||
                   article.description.toLowerCase().includes(cleanQuery);
        });

        if (filtered.length === 0) {
            noResults.style.display = 'block';
            return;
        }

        noResults.style.display = 'none';

        filtered.forEach(article => {
            const card = document.createElement('div');
            card.className = `card ${article.color}`;
            card.onclick = () => openArticle(article.id);

            card.innerHTML = `
                <div class="card-title-group">
                    <div>${article.title}</div>
                    <div class="card-author">By ${article.author} — ${article.description}</div>
                </div>
                <span class="material-symbols-outlined">chevron_right</span>
            `;
            articlesGrid.appendChild(card);
        });
    }

    function openArticle(id) {
        const article = articlesData.find(a => a.id === id);
        if (!article) return;

        document.getElementById('readTitle').textContent = article.title;
        document.getElementById('readAuthor').textContent = `By ${article.author}`;
        document.getElementById('readDescription').textContent = article.description;
        document.getElementById('readContent').innerHTML = article.content;

        document.getElementById('listView').classList.remove('active');
        document.getElementById('readView').classList.add('active');
        window.scrollTo(0,0);

        currentArticleId = id;

const url = new URL(window.location);
url.searchParams.set("article", id);
window.history.replaceState({}, "", url);

    }

    function showListView() {
        document.getElementById('readView').classList.remove('active');
        document.getElementById('listView').classList.add('active');

        const url = new URL(window.location);
url.searchParams.delete("article");
window.history.replaceState({}, "", url);

    }

   window.onload = () => {
    const query = getQueryParam("query") || "";
    renderArticles(query);

    const articleId = getQueryParam("article");
    if (articleId) {
        openArticle(articleId);
    }
};

    function shareArticle() {
    if (!currentArticleId) return;

    const link = window.location.href;

    prompt("Share", link);
}

function updateBackButton() {
    const topPath = window.top.location.pathname;

    if (topPath.endsWith("/articles.html") || topPath.endsWith("articles.html")) {
        document.getElementById("backArticlesBtn").style.display = "none";
        document.getElementById("backHomeBtn").style.display = "inline-flex";
    } else {
        document.getElementById("backArticlesBtn").style.display = "inline-flex";
        document.getElementById("backHomeBtn").style.display = "none";
    }
}

updateBackButton()

</script>

</body>
</html>
